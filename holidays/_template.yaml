# Plantilla. Cópiala a es/<año>.yaml y transcribe la resolución del BOE.
#
# El fichero no se carga: `import_holidays` ignora los que empiezan por guion
# bajo, igual que hace `agreements` con su plantilla.

format: 1
country: ES
year: 0000

source:
  publication: BOE-A-0000-00000
  published_on: 0000-00-00
  url: https://www.boe.es/

# Los que rigen en todo el Estado. Cuatro son irrenunciables (art. 37.2): Año
# Nuevo, 1 de mayo, 12 de octubre y Navidad. El resto puede sustituirlos una
# comunidad, y entonces va abajo en la suya y no aquí.
national: []
#  - day: 0000-01-01
#    name: Año Nuevo

# Por código ISO 3166-2:ES. Solo los propios de la comunidad: los nacionales no
# se repiten.
regions: {}
#  ES-AN:
#    - day: 0000-02-28
#      name: Día de Andalucía
