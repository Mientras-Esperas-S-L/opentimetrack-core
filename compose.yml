# Pila de desarrollo. Pensada para podman (rootless), compatible con docker.
#
#   podman compose up --build
#
# Objetivo declarado: de cero a la API respondiendo en menos de 15 minutos.

name: opentimetrack

services:
  api:
    build:
      context: ./backend
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app:z
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ./backend
      target: dev
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app:z
    env_file: .env
    depends_on:
      - redis
    profiles: ["worker"]

  web:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000/api

  db:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: ott
      POSTGRES_PASSWORD: ott
      POSTGRES_DB: opentimetrack
    volumes:
      # PostgreSQL 18 recomienda montar el directorio padre, no el de datos: así
      # los datos quedan en un subdirectorio y una futura actualizacion mayor con
      # `pg_upgrade --link` no tropieza con el limite del punto de montaje.
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ott -d opentimetrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: docker.io/library/redis:8-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: docker.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  miniodata:
