# Pila de desarrollo. Pensada para podman (rootless), compatible con docker.
#
#   podman compose up --build
#
# Objetivo declarado: de cero a la API respondiendo en menos de 15 minutos.
#
# Los puertos que se publican en el host salen de variables con valor por
# defecto, de modo que quien no defina nada sigue teniendo 8000/3000/5432/6379
# como hasta ahora. Se parametrizaron para poder convivir con otra pila en la
# misma maquina: si Geosian esta levantado, ocupa 8000 y 6379 y esta no arranca.
# Los valores propios van en el .env (OTT_PORT_API, OTT_PORT_WEB, OTT_PORT_DB,
# OTT_PORT_REDIS). Ojo: OTT_PORT_API tambien viaja a VITE_API_URL, porque el
# navegador llama a la API por el puerto del host, no por el de la red interna.

name: opentimetrack

services:
  api:
    build:
      context: ./backend
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app:z
      # La documentacion, de solo lectura, porque hay pruebas que la contrastan
      # contra el codigo: la crontab que trae `trabajos-periodicos.md` es la
      # unica atadura entre las dos formas de programar los trabajos, y cuando
      # se anadio uno solo a Celery, en la instalacion por defecto no corria.
      - ./docs:/docs:ro,z
      # Fichas de convenio. Van aparte del codigo porque se publican con otra
      # licencia y porque un despliegue puede apuntar AGREEMENTS_DIR a las de su
      # asesoria laboral en vez de a las nuestras.
      - ./agreements:/agreements:ro,z
      # Calendarios laborales. Aparte por lo mismo: se transcriben del BOE, se
      # publican por año, y un despliegue puede querer los suyos.
      - ./holidays:/holidays:ro,z
    ports:
      - "${OTT_PORT_API:-8000}:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Los trabajos que se repiten --- recordatorios de fichaje, purga de metadatos
  # --- se ejecutan por cron o por Celery, y lo elige quien instala con
  # SCHEDULER en el .env. Ver docs/instalacion/trabajos-periodicos.md.
  #
  # Por defecto (SCHEDULER=cron) estos dos servicios no se levantan: una línea
  # en la crontab hace lo mismo sin dos procesos más que vigilar. Con
  # SCHEDULER=celery:
  #
  #   podman compose --profile celery up -d
  #
  # Los dos hacen falta y hacen cosas distintas: `beat` decide cuándo, `worker`
  # ejecuta. Solo beat, y nada corre; solo worker, y nadie le manda nada.
  worker:
    build:
      context: ./backend
      target: dev
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app:z
      - ./agreements:/agreements:ro,z
      - ./holidays:/holidays:ro,z
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["celery"]

  beat:
    build:
      context: ./backend
      target: dev
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app:z
    env_file: .env
    depends_on:
      - redis
    profiles: ["celery"]

  web:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
    ports:
      - "${OTT_PORT_WEB:-3000}:3000"
    environment:
      VITE_API_URL: http://localhost:${OTT_PORT_API:-8000}/api

  db:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: ott
      POSTGRES_PASSWORD: ott
      POSTGRES_DB: opentimetrack
    volumes:
      # PostgreSQL 18 recomienda montar el directorio padre, no el de datos: así
      # los datos quedan en un subdirectorio y una futura actualizacion mayor con
      # `pg_upgrade --link` no tropieza con el limite del punto de montaje.
      - pgdata:/var/lib/postgresql
    ports:
      - "${OTT_PORT_DB:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ott -d opentimetrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: docker.io/library/redis:8-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    ports:
      - "${OTT_PORT_REDIS:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Almacen de objetos compatible con S3.
  #
  # Opcional. Por defecto los justificantes van a disco (STORAGE_BACKEND=
  # filesystem), que es de sobra para un servidor y no obliga a levantar esto.
  # Para trabajar contra S3:
  #
  #   podman compose --profile s3 up -d
  #   # y en .env: STORAGE_BACKEND=s3
  #
  # Era MinIO hasta el 12/08/2026. Sus duenos archivaron el repositorio el
  # 25/04/2026 y lo dejaron en solo lectura: sin mantenimiento, sin parches y
  # sin binarios precompilados para la version libre. No se puede pedir a nadie
  # que despliegue eso, y menos en la pieza que guarda documentos de personas.
  # Ver ADR-0016.
  #
  # SeaweedFS es Apache 2.0 y esta vivo. El codigo no nota el cambio: sigue
  # hablando S3 por django-storages.
  storage:
    profiles: ["s3"]
    image: docker.io/chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=64
    volumes:
      - storagedata:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:z
    ports:
      # 8333 es la API S3; 8888 el explorador de ficheros, util en desarrollo.
      - "8333:8333"
      - "8888:8888"
    healthcheck:
      # Sin firmar, S3 responde 403: eso ya prueba que el servicio esta en pie.
      # Un 200 aqui significaria que acepta peticiones sin autenticar.
      #
      # 127.0.0.1 y no localhost: dentro del contenedor localhost resuelve a
      # ::1 y SeaweedFS solo escucha en IPv4, asi que con el nombre da
      # "connection refused" para siempre y el servicio nunca llega a sano.
      #
      # Sin -q: es -S quien imprime la cabecera, y -q la silencia.
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q '403'"]
      interval: 10s
      timeout: 5s
      retries: 6
      # El servidor de volumenes tarda en registrarse; 20 s se quedaban cortos.
      start_period: 45s

volumes:
  pgdata:
  redisdata:
  storagedata:
